name: Daemon

on:
  push:
    paths:
      - "bryant-carrier/daemon/**"
      - ".github/workflows/daemon.yml"
  pull_request:
    paths:
      - "bryant-carrier/daemon/**"
      - ".github/workflows/daemon.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bryant-carrier/daemon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bryant-carrier/daemon/go.mod
          cache-dependency-path: bryant-carrier/daemon/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The add-on ships on all of these, so a compile break on an architecture
      # nobody develops on should fail here rather than at add-on install time.
      - name: Cross-compile for every add-on architecture
        run: |
          set -e
          for target in linux/amd64 linux/arm64 linux/arm linux/386; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -o /dev/null .
          done
